<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陆时</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a7ba6">
<link rel="apple-touch-icon" href="icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f2f4f8;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .app {
    width: 100%;
    max-width: 520px;
    height: 96vh;
    background: #ffffff;
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    position: relative;
  }
  .header {
    padding: 16px 18px;
    background: #ffffff;
    border-bottom: 1px solid #ececf0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #d9dee7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #3a3f47;
    overflow: hidden;
    cursor: pointer;
    flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .info { flex: 1; }
  .info .name { font-size: 16px; font-weight: 600; color: #23262b; }
  .menuBtn {
    width: 36px; height: 36px; border: none;
    background: transparent; font-size: 22px;
    cursor: pointer; color: #555a60;
  }
  #messages {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #f7f8fa;
    background-size: cover;
    background-position: center;
  }
  .row { display: flex; gap: 8px; max-width: 82%; }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.ai { align-self: flex-start; }
  .msg-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: #d9dee7; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #3a3f47; overflow: hidden; cursor: pointer;
  }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .bubble-wrap { display: flex; flex-direction: column; }
  .bubble {
    padding: 10px 13px; border-radius: 16px;
    font-size: 15px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .bubble img { max-width: 220px; border-radius: 12px; display: block; }
  .user .bubble { background: #4a7ba6; color: white; border-top-right-radius: 4px; }
  .ai .bubble {
    background: #ffffff; color: #2b2e33;
    border: 1px solid #e4e6eb; border-top-left-radius: 4px;
  }
  .meta {
    font-size: 11px; color: #9a9ea6; margin-top: 4px;
    display: flex; gap: 6px; align-items: center;
  }
  .user .meta { justify-content: flex-end; }
  .read-status { color: #4a7ba6; }
  .unread-status { color: #b0b3b8; }
  .input-wrap {
    padding: 12px; background: #ffffff;
    border-top: 1px solid #ececf0;
    display: flex; gap: 8px; align-items: center;
  }
  #userInput {
    flex: 1; background: #f3f4f6; color: #23262b;
    border: 1px solid #e1e3e8; border-radius: 18px;
    padding: 11px 15px; font-size: 15px; outline: none;
  }
  #plusBtn {
    width: 36px; height: 36px; border-radius: 50%;
    background: #f3f4f6; border: 1px solid #e1e3e8;
    cursor: pointer; position: relative; flex-shrink: 0;
  }
  #plusBtn::before, #plusBtn::after {
    content: ""; position: absolute; background: #6b7076; border-radius: 2px;
  }
  #plusBtn::before { width: 16px; height: 2px; top: 17px; left: 10px; }
  #plusBtn::after { width: 2px; height: 16px; top: 10px; left: 17px; }
  #sendBtn {
    background: #4a7ba6; color: white; border: none;
    border-radius: 18px; padding: 0 16px; font-size: 15px; cursor: pointer;
  }
  .usage {
    padding: 8px 16px; font-size: 12px; color: #7a7f87;
    background: #ffffff; border-top: 1px solid #ececf0;
    text-align: right; line-height: 1.7;
  }
  .panel {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #ffffff; border-radius: 20px 20px 0 0;
    padding: 18px 16px 22px; box-shadow: 0 -6px 24px rgba(0,0,0,0.08);
    display: none; z-index: 30;
  }
  .panel.show { display: block; }
  .panel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .panel-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; cursor: pointer;
  }
  .panel-icon {
    width: 52px; height: 52px; border-radius: 16px;
    background: #f3f4f6; display: flex; align-items: center;
    justify-content: center; font-size: 24px;
  }
  .panel-label { font-size: 12px; color: #555a60; }
  .settings-menu {
    position: absolute; top: 60px; right: 12px;
    background: #ffffff; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    padding: 10px; display: none; z-index: 40; min-width: 160px;
  }
  .settings-menu.show { display: block; }
  .settings-item {
    padding: 10px 12px; font-size: 14px; color: #2b2e33;
    border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .settings-item:active { background: #f3f4f6; }
  .memory-panel {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: #ffffff; z-index: 50; display: none; flex-direction: column;
  }
  .memory-panel.show { display: flex; }
  .memory-header {
    padding: 16px; border-bottom: 1px solid #ececf0;
    display: flex; align-items: center; gap: 10px; font-weight: 600;
  }
  .memory-list {
    flex: 1; overflow-y: auto; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .memory-item {
    background: #f7f8fa; padding: 10px 12px; border-radius: 12px;
    display: flex; align-items: center; gap: 10px; font-size: 14px;
  }
  .memory-item span { flex: 1; }
  .memory-item button {
    background: none; border: none; color: #c0392b;
    cursor: pointer; font-size: 14px;
  }
  .memory-input-wrap {
    padding: 12px 16px; border-top: 1px solid #ececf0;
    display: flex; gap: 8px;
  }
  .memory-input-wrap input {
    flex: 1; background: #f3f4f6; border: 1px solid #e1e3e8;
    border-radius: 14px; padding: 10px 14px; font-size: 14px; outline: none;
  }
  .memory-input-wrap button {
    background: #4a7ba6; color: white; border: none;
    border-radius: 14px; padding: 0 14px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <div class="avatar" id="headerAvatar" title="点击更换头像">陆</div>
    <div class="info"><div class="name">陆时</div></div>
    <button class="menuBtn" id="menuBtn">⋯</button>
  </div>

  <div id="messages"></div>
  <div class="usage" id="usage">Token：暂无</div>

  <div class="input-wrap">
    <input id="userInput" placeholder="和陆时说话..." autocomplete="off">
    <button id="plusBtn" title="更多"></button>
    <button id="sendBtn">发送</button>
  </div>

  <div class="settings-menu" id="settingsMenu">
    <div class="settings-item" id="bgSetting">🖼️ 聊天背景</div>
    <div class="settings-item" id="bubbleColorSetting">🎨 气泡颜色</div>
    <div class="settings-item" id="bubbleStyleSetting">💬 气泡样式</div>
    <div class="settings-item" id="memorySetting">🧠 记忆库</div>
  </div>

  <div class="panel" id="morePanel">
    <div class="panel-grid">
      <div class="panel-item" id="panelImage"><div class="panel-icon">📷</div><div class="panel-label">图片</div></div>
      <div class="panel-item" id="panelFile"><div class="panel-icon">📁</div><div class="panel-label">文件</div></div>
      <div class="panel-item" id="panelCall"><div class="panel-icon">📞</div><div class="panel-label">语音/视频</div></div>
      <div class="panel-item" id="panelMusic"><div class="panel-icon">🎧</div><div class="panel-label">一起听</div></div>
    </div>
  </div>

  <div class="memory-panel" id="memoryPanel">
    <div class="memory-header">
      <span>🧠 记忆库</span>
      <button class="menuBtn" id="closeMemoryBtn" style="margin-left:auto">×</button>
    </div>
    <div class="memory-list" id="memoryList"></div>
    <div class="memory-input-wrap">
      <input id="memoryInput" placeholder="添加一条记忆...">
      <button id="addMemoryBtn">添加</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">
<input type="file" id="chatImageInput" accept="image/*" style="display:none">
<input type="file" id="bgInput" accept="image/*" style="display:none">

<script src="lushi-core.js"></script>
<script src="lushi-plugin.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
